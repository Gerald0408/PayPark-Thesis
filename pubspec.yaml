name: yos_app
description: "YOS â€” Yard Operating System for Barangay Collectors. Offline-first vehicle logging with thermal receipt printing."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_face_detection: ^0.11.1
  flutter_secure_storage: ^10.3.1
  tflite_flutter: ^0.11.0
  light: ^5.0.0
  screen_brightness: ^2.1.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.4.10

  # Bluetooth thermal printing (ESC/POS)
  flutter_pos_printer_platform_image_3: ^1.1.0
  esc_pos_utils_plus: ^2.0.4
  # Used directly to rasterize the receipt logo into an ESC/POS bitmap —
  # previously only a transitive dependency (see dependency_overrides
  # below), now also a direct one since printer_service.dart imports it.
  image: ^4.3.0

  # Connectivity awareness for sync badge
  connectivity_plus: ^6.0.5

  # Local encrypted backup
  path_provider: ^2.1.4
  encrypt: ^5.0.3
  crypto: ^3.0.5

  # Local on-device store for captured vehicle document photos
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Manual cross-device photo transfer (no Firebase Storage on the free
  # plan — see VehicleDocumentCache's export/import)
  archive: ^3.6.1
  share_plus: ^10.1.4
  file_picker: ^8.1.6

  # Silent copy of captured document photos to public Downloads storage
  # (survives an app uninstall/data-clear) — see VehicleDocumentCache's
  # backup write. Uses Android's MediaStore API under the hood, required
  # on this app's target SDK (scoped storage, no legacy direct file path).
  media_store_plus: ^0.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  permission_handler: ^11.4.0
  pdf: ^3.11.3
  printing: ^5.14.3
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Fixes version conflict between esc_pos_utils_plus (image 4.x) and flutter_pos_printer_platform (image 3.x)
dependency_overrides:
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/icon/logo_receipt.png
    - assets/models/mobilefacenet.tflite
    - assets/videos/intro_background.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
